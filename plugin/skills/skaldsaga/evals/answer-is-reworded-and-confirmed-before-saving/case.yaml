schema_version: "1.1"
name: answer-is-reworded-and-confirmed-before-saving
expected_outcome: |
  The writer gave an idea in a set-up, empty story folder. The skill rewords it back in
  slightly more craft-like prose and asks whether that is what the writer meant, as its only
  question. It saves nothing to the story until the writer says yes. It records only that an
  answer is waiting for confirmation.
context:
  scaffold_script: place-files.sh
