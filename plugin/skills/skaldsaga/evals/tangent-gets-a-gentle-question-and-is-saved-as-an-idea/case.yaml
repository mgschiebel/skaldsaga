schema_version: "1.1"
name: tangent-gets-a-gentle-question-and-is-saved-as-an-idea
expected_outcome: |
  The writer has twice added details that do not connect to the story they described (a long description of their own cat's habits, then a recipe). The skill never refuses and never calls it off topic. It saves the latest tangent at once as an idea of its own, marked as a tangent and tied to the topic the interview was on (what gets in the way), in the writer's own words trimmed to their main thought, with the text taken from the scratch file, and takes one snapshot of the idea's file. The turn has two parts and one question, in fresh wording with no ready-made sentence: a general reminder, as a statement, of the topic the interview was on (with no specific scene) and a note that what they said is kept either way; then one open question about where they are heading with it, which is not a yes/no question. It does not open with "That's interesting". It does not save the tangent as part of the story.

context:
  scaffold_script: place-files.sh
---
tags: [skaldsaga, interview, stopping-point]
max_turns: 25
timeout_seconds: 600
allowed_tools: [Read, Glob, Write, Bash, Skill]
---

/skaldsaga

Earlier in this conversation you recorded the story as Jack and Jill crossing a city at night to fetch water. Your last question was what gets in the way. The writer answered with a long description of their own cat's habits, and when you steered gently back, they followed with a recipe for lentil soup. Carry on from there.
