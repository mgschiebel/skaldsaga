schema_version: "1.1"
name: stopping-with-an-unconfirmed-answer-gives-the-plain-notice
expected_outcome: |
  The writer has just given an answer that the skill reworded but the writer has not yet confirmed. The writer then says that is all for today and asks to save. Before stopping, the skill shows that unconfirmed answer in the writer's own words and says plainly that it may be lost the next time they start. It then records the stop with a reason that is true (the writer saying they are done), saves one snapshot with exactly the paths the stop returned and the message file the program wrote, and ends with one short line. It does not offer to keep the answer as a maybe.

context:
  scaffold_script: place-files.sh
---
tags: [skaldsaga, interview, stopping-point]
max_turns: 25
timeout_seconds: 600
allowed_tools: [Read, Glob, Write, Bash, Skill]
---

/skaldsaga

Earlier in this conversation the writer answered "maybe they hide in a dark alley" to a question about what gets in the way. You recorded it as not yet confirmed and reworded it ("So at some point Jack and Jill hide in a dark alley. Is that what you meant?"). Instead of answering, the writer said: "Actually that's all for today, please save it." Carry on from there.
