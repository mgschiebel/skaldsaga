schema_version: "1.1"
name: bare-asks-if-no-story-is-expected
expected_outcome: |
  The folder is empty and the writer typed nothing else. The skill does not assume a new
  start: it says plainly that it is not finding a story and asks one question, whether that
  is right or whether the writer expected one to be here. It sets nothing up before the
  writer answers.
