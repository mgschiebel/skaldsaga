schema_version: "1.1"
name: resume-from-a-stopping-point-suggests-one-area
expected_outcome: |
  The last session ended at a stopping point. The writer types /skaldsaga with nothing after it. The skill gives a short recap of what is decided (two or three plain sentences, using the writer's own words for the story) and makes one suggestion for what to look at next, in the form of one question that also says they can pick something else. It changes nothing on disk before the writer answers: no snapshot, no files written.

context:
  scaffold_script: place-files.sh
---
tags: [skaldsaga, interview, stopping-point]
max_turns: 25
timeout_seconds: 600
allowed_tools: [Read, Glob, Write, Bash, Skill]
---

/skaldsaga
