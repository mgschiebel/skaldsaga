[workspace]
resolver = "3"
members = ["crates/skaldsaga-core", "crates/skaldsaga"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mgschiebel/skaldsaga"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Parsing code that panics is a denial of service, because the release build
# uses panic = "abort" (docs/security/appsec-tooling-research.md, "Other tools
# worth considering"). These lints keep new code from panicking on its input;
# they are not applied to tests (clippy.toml and the test files).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
