# Keeps dependencies and pinned Actions current (SR-43, SR-40). Each update
# arrives as a pull request for the author to review; nothing merges itself.
# Daily, not weekly: exploitation can follow an advisory within hours
# (appsec-tooling-research.md, Decided item 2). Security updates are never
# delayed. The cooldown only holds back ordinary version updates for three
# days after a release, so a malicious release has time to be pulled before a
# pull request offers it (Decided October 25, 2026; GitHub's own default since
# July 2026, written out here so it is explicit and zizmor can check it).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "Dependencies:"

  # The fuzz crate has its own Cargo.lock and is never shipped.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "Dependencies:"

  # The Claude Code version CI uses to validate the plugin (test tool, never shipped).
  - package-ecosystem: npm
    directory: /ci/claude-code
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "Dependencies:"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "Actions:"
