name: Privacy

# Keeps Claude session links out of new commits and pull request descriptions
# (security requirement SR-03). Separate from CI so that editing a pull request
# description re-runs only this check.

on:
  push:
    branches-ignore: [main, dist]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  session-links:
    name: Privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No Claude session links
        env:
          # Passed through the environment, never inlined into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            sh ci/check-session-links.sh "$BASE_SHA" "$HEAD_SHA"
          else
            # A branch push: check what the branch adds on top of main.
            sh ci/check-session-links.sh origin/main HEAD
          fi
