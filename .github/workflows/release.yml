name: Release

# Publishes a release: builds the Linux x64 binary, creates the version tag
# and a GitHub Release, and rebuilds the `dist` branch (the plugin files plus
# the binary, built together from one version). Writers' plugins install from
# `dist`; `main` holds source only.
#
# Started with "Run workflow" on main (Actions tab, or the REST API). The
# version comes from Cargo.toml; the workflow creates tag v<version> itself
# and refuses if that tag already exists. Pushing a tag does NOT release
# (SR-45): only a person who can run workflows on main can.
#
# Two jobs, so the token that can write is only in the one that publishes
# (SR-41): `build` has read-only access and runs all the project's code;
# `publish` can write, but only unpacks what `build` made and pushes it.
#
# "dry_run" (testing the workflow itself) runs both jobs from any branch but
# publishes nothing: no release, no tag, and the dist push is only rehearsed.
#
# Supply-chain files (docs/security/appsec-tooling-research.md, Decided items 8,
# 9 and 11): the binary is built with `cargo auditable`, so it carries its exact
# dependency tree, and that data is checked against RustSec before release. The
# release also carries an SPDX SBOM and a third-party notices file, both built
# from the locked dependencies and docs/security/license-elections.toml.
#
# Phase 1 builds Linux x64 only. macOS, Windows and Linux ARM (via cargo-dist)
# and signing come with the public-release phase.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and rehearse everything, publish nothing (for testing this workflow)"
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner already has rustup, so no third-party action is needed (SR-42).
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      - name: Work out the version and tag
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print([p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="skaldsaga"][0])')
          tag="v$version"
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases are made from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists. Bump the version in Cargo.toml and plugin.json first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked

      # Built from the locked, checksummed crates.io releases of these exact versions (SR-42).
      - name: Install the supply-chain tools
        run: |
          cargo install cargo-auditable --locked --version 0.7.7
          cargo install rust-audit-info --locked --version 0.5.4
          cargo install cargo-audit --locked --version 0.22.2

      - name: Build
        run: cargo auditable build --release --locked

      # `cargo audit bin` only warns when the data is missing from the binary, so
      # rust-audit-info (which fails) checks it is there, and the SBOM script checks
      # that the SBOM lists exactly what the binary says it is built from.
      - name: Check the binary's dependency data against known advisories
        run: |
          set -eu
          rust-audit-info target/release/skaldsaga > "$RUNNER_TEMP/audit-info.json"
          python3 -I ci/release-files.py matches --audit-info "$RUNNER_TEMP/audit-info.json"
          cargo audit --deny warnings bin target/release/skaldsaga

      - name: Assemble the distribution folder
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          sh ci/assemble-dist.sh dist target/release/skaldsaga
          cat > dist/README.md <<EOF
          # Skaldsaga (distribution build)

          Built automatically from tag ${TAG} (commit ${GITHUB_SHA}).
          Do not edit this branch by hand; source lives on \`main\`.

          Install in Claude Code:

              /plugin marketplace add mgschiebel/skaldsaga#dist
              /plugin install skaldsaga@skaldsaga
          EOF
          sh dist/scripts/skaldsaga --version
          tar -C dist -czf "skaldsaga-${VERSION}-linux-x64.tar.gz" .
          # A checksum file to publish with the tarball (SR-44). It is also
          # checked again in the publish job, so a change between the jobs shows.
          sha256sum "skaldsaga-${VERSION}-linux-x64.tar.gz" > "skaldsaga-${VERSION}-linux-x64.tar.gz.sha256"
          cat "skaldsaga-${VERSION}-linux-x64.tar.gz.sha256"
          # The SBOM and the third-party notices (the notices are also inside the
          # tarball, in dist/), each published on its own and checksummed.
          python3 -I ci/release-files.py sbom --output "skaldsaga-${VERSION}-sbom.spdx.json"
          cp dist/THIRD-PARTY-NOTICES.md "skaldsaga-${VERSION}-third-party-notices.md"
          sha256sum "skaldsaga-${VERSION}-sbom.spdx.json" "skaldsaga-${VERSION}-third-party-notices.md" \
            > "skaldsaga-${VERSION}-sbom-and-notices.sha256"
          cat "skaldsaga-${VERSION}-sbom-and-notices.sha256"

      # Only the tarball, the SBOM, the notices and their checksums travel
      # between the jobs: the tarball keeps the files' permissions, which a
      # plain artifact upload of the folder would drop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            skaldsaga-*-linux-x64.tar.gz
            skaldsaga-*-linux-x64.tar.gz.sha256
            skaldsaga-*-sbom.spdx.json
            skaldsaga-*-third-party-notices.md
            skaldsaga-*-sbom-and-notices.sha256
          if-no-files-found: error
          retention-days: 7

  # The SPDX validator comes from PyPI, so it runs here, in a job that holds no
  # token and cannot change what `build` made, and `publish` waits for it.
  check-sbom:
    name: Check the SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Check the SBOM against the SPDX format
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/spdx-venv"
          "$RUNNER_TEMP/spdx-venv/bin/pip" install --quiet spdx-tools==0.8.5
          "$RUNNER_TEMP/spdx-venv/bin/pyspdxtools" -i skaldsaga-*-sbom.spdx.json

  publish:
    name: Publish
    needs: [build, check-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and push the dist branch; no other job can write (SR-41)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The token is not left in the checkout's git config; the one step
          # that pushes passes it through the environment instead (below).
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Unpack the build
        run: |
          set -eu
          # What was built is what gets published: the checksum must still match.
          sha256sum --check skaldsaga-*-linux-x64.tar.gz.sha256
          sha256sum --check skaldsaga-*-sbom-and-notices.sha256
          mkdir dist
          tar -C dist -xzf skaldsaga-*-linux-x64.tar.gz
          sh dist/scripts/skaldsaga --version

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          # Creates the tag at this commit if it doesn't exist yet.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would create release $TAG at $GITHUB_SHA with skaldsaga-$VERSION-linux-x64.tar.gz"
            ls -l "skaldsaga-$VERSION-linux-x64.tar.gz" "skaldsaga-$VERSION-linux-x64.tar.gz.sha256" \
              "skaldsaga-$VERSION-sbom.spdx.json" "skaldsaga-$VERSION-third-party-notices.md" \
              "skaldsaga-$VERSION-sbom-and-notices.sha256"
            gh release list --limit 1
          else
            gh release create "$TAG" \
              "skaldsaga-$VERSION-linux-x64.tar.gz" \
              "skaldsaga-$VERSION-linux-x64.tar.gz.sha256" \
              "skaldsaga-$VERSION-sbom.spdx.json" \
              "skaldsaga-$VERSION-third-party-notices.md" \
              "skaldsaga-$VERSION-sbom-and-notices.sha256" \
              --target "$GITHUB_SHA" \
              --title "Skaldsaga $TAG" \
              --notes "Phase 1 test build (not a public release). Linux x64 only, unsigned. To check a download: sha256sum --check skaldsaga-$VERSION-linux-x64.tar.gz.sha256. The SPDX SBOM and the third-party notices are attached too." \
              --prerelease
          fi

      - name: Update the dist branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          # Authenticate git for this step only, through environment variables:
          # nothing is written to .git/config, and the derived value is masked
          # because only the token itself is masked automatically.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=$(mktemp -d)
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch --depth 1 origin dist
            git worktree add "$work" FETCH_HEAD
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan dist
          fi
          git -C "$work" rm -rqf --ignore-unmatch .
          cp -a dist/. "$work/"
          git -C "$work" add -A
          git -C "$work" commit -q -m "Build $TAG from $GITHUB_SHA"
          if [ "$DRY_RUN" = "true" ]; then
            git -C "$work" push --dry-run origin HEAD:refs/heads/dist
          else
            git -C "$work" push origin HEAD:refs/heads/dist
          fi
