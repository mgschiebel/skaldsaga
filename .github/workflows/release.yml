name: Release

# Publishes a release: builds the Linux x64 binary, creates the version tag
# and a GitHub Release, and rebuilds the `dist` branch (the plugin files plus
# the binary, built together from one version). Writers' plugins install from
# `dist`; `main` holds source only.
#
# Started with "Run workflow" on main (Actions tab, or the REST API). The
# version comes from Cargo.toml; the workflow creates tag v<version> itself
# and refuses if that tag already exists. Pushing a tag does NOT release
# (SR-45): only a person who can run workflows on main can.
#
# Two jobs, so the token that can write is only in the one that publishes
# (SR-41): `build` has read-only access and runs all the project's code;
# `publish` can write, but only unpacks what `build` made and pushes it.
#
# "dry_run" (testing the workflow itself) runs both jobs from any branch but
# publishes nothing: no release, no tag, and the dist push is only rehearsed.
#
# Phase 1 builds Linux x64 only. macOS, Windows and Linux ARM (via cargo-dist)
# and signing come with the public-release phase.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and rehearse everything, publish nothing (for testing this workflow)"
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0

      - name: Work out the version and tag
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print([p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="skaldsaga"][0])')
          tag="v$version"
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases are made from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists. Bump the version in Cargo.toml and plugin.json first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Assemble the distribution folder
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          sh ci/assemble-dist.sh dist target/release/skaldsaga
          cat > dist/README.md <<EOF
          # Skaldsaga (distribution build)

          Built automatically from tag ${TAG} (commit ${GITHUB_SHA}).
          Do not edit this branch by hand; source lives on \`main\`.

          Install in Claude Code:

              /plugin marketplace add mgschiebel/skaldsaga#dist
              /plugin install skaldsaga@skaldsaga
          EOF
          sh dist/scripts/skaldsaga --version
          tar -C dist -czf "skaldsaga-${VERSION}-linux-x64.tar.gz" .

      # Only the tarball travels between the jobs: it keeps the files'
      # permissions, which a plain artifact upload of the folder would drop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: skaldsaga-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Unpack the build
        run: |
          set -eu
          mkdir dist
          tar -C dist -xzf skaldsaga-*-linux-x64.tar.gz
          sh dist/scripts/skaldsaga --version

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          # Creates the tag at this commit if it doesn't exist yet.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would create release $TAG at $GITHUB_SHA with skaldsaga-$VERSION-linux-x64.tar.gz"
            ls -l "skaldsaga-$VERSION-linux-x64.tar.gz"
            gh release list --limit 1
          else
            gh release create "$TAG" \
              "skaldsaga-$VERSION-linux-x64.tar.gz" \
              --target "$GITHUB_SHA" \
              --title "Skaldsaga $TAG" \
              --notes "Phase 1 test build (not a public release). Linux x64 only, unsigned." \
              --prerelease
          fi

      - name: Update the dist branch
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work=$(mktemp -d)
          if git ls-remote --exit-code --heads origin dist >/dev/null; then
            git fetch --depth 1 origin dist
            git worktree add "$work" FETCH_HEAD
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan dist
          fi
          git -C "$work" rm -rqf --ignore-unmatch .
          cp -a dist/. "$work/"
          git -C "$work" add -A
          git -C "$work" commit -q -m "Build $TAG from $GITHUB_SHA"
          if [ "$DRY_RUN" = "true" ]; then
            git -C "$work" push --dry-run origin HEAD:refs/heads/dist
          else
            git -C "$work" push origin HEAD:refs/heads/dist
          fi
