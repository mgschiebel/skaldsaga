name: Secrets

# Scans the commits a push or pull request adds for credentials (SR-04), so
# a secret is caught even where GitHub's push protection doesn't know the
# pattern. Separate from CI so it can run on every branch.

on:
  push:
    branches-ignore: [dist]
  pull_request:

permissions: {}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installed as a Go module of an exact version (the module still declares
      # its original path, zricethezav/gitleaks): the Go checksum
      # database verifies what is downloaded, so no third-party Action or
      # unchecked binary runs in this job.
      - name: Install gitleaks
        run: |
          set -u
          # Failures become annotations too, so they show on the pull request.
          if ! go install github.com/zricethezav/gitleaks/v8@v8.30.1 > install.log 2>&1; then
            echo "::error::go install failed: $(tr '\n' ' ' < install.log | head -c 1500)"
            exit 1
          fi

      - name: Scan the new commits
        env:
          # Passed through the environment, never inlined into the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          else
            # A branch push: what the branch adds on top of main.
            range="origin/main..HEAD"
          fi
          echo "Scanning $range"
          "$(go env GOPATH)/bin/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="$range" \
            --redact --no-banner --verbose --exit-code 1 .
