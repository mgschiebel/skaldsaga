name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by commit; the toolchain version is pinned here and in release.yml (SR-42).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # These checks live in ci/presubmit.sh, which build sessions run before
      # every push, so the local run and this gate are the same thing. The
      # dependency checks run in deny.yml.
      - name: Format
        run: sh ci/presubmit.sh fmt

      - name: Lint
        run: sh ci/presubmit.sh clippy

      - name: Test
        run: sh ci/presubmit.sh test

      - name: Check the license lists agree
        run: sh ci/presubmit.sh license-sync

      - name: Check the license elections cover the dependencies
        run: sh ci/presubmit.sh license-elections

      # Built from the locked, checksummed crates.io releases of these exact versions (SR-42).
      - name: Install cargo-auditable and rust-audit-info
        run: |
          cargo install cargo-auditable --locked --version 0.7.7
          cargo install rust-audit-info --locked --version 0.5.4

      # The release binary carries its exact dependency tree, so a later advisory
      # can be checked against what was shipped.
      - name: Build release binary
        run: cargo auditable build --release --locked

      # `cargo audit bin` only warns when the data is missing, so this is the check
      # that it is there, survived stripping, and matches the SBOM.
      - name: Check the binary carries its dependency data
        run: |
          set -eu
          rust-audit-info target/release/skaldsaga > "$RUNNER_TEMP/audit-info.json"
          python3 -I ci/release-files.py matches --audit-info "$RUNNER_TEMP/audit-info.json"

      - name: Build the SBOM and check it against the SPDX format
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/spdx-venv"
          "$RUNNER_TEMP/spdx-venv/bin/pip" install --quiet spdx-tools==0.8.5
          python3 -I ci/release-files.py sbom --output "$RUNNER_TEMP/sbom.spdx.json"
          "$RUNNER_TEMP/spdx-venv/bin/pyspdxtools" -i "$RUNNER_TEMP/sbom.spdx.json"

      - name: Check the shell scripts
        # Findings are turned into annotations so they show on the pull request.
        run: |
          set -o pipefail
          sh ci/presubmit.sh shellcheck \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'

      - name: Assemble the plugin
        run: sh ci/assemble-dist.sh dist target/release/skaldsaga

      - name: Validate the plugin
        run: |
          npm install --global --silent @anthropic-ai/claude-code@2.1.310
          claude plugin validate --strict dist
          claude plugin validate --strict dist/.claude-plugin/plugin.json

      - name: Smoke test the assembled plugin
        run: |
          set -eu
          d=$PWD/dist
          t=$(mktemp -d)
          mkdir -p "$t/novel/.harness" "$t/elsewhere"
          chmod -x "$d/scripts/skaldsaga" "$d/scripts/bin/linux-x64/skaldsaga"   # simulate an install that drops the bits
          sh "$d/scripts/skaldsaga" --version

          # Status line
          out=$(printf '{"session_id":"ci","workspace":{"project_dir":"%s"},"context_window":{"used_percentage":72}}' "$t/novel" \
            | sh "$d/scripts/skaldsaga" meter statusline)
          echo "$out"
          test "$out" = "Skaldsaga · session 72% full · time to wrap up"
          sh "$d/scripts/skaldsaga" meter check --project "$t/novel" | grep -q '"state": "wrap_up"'

          # Session-start hook: silent elsewhere, adds context in a project
          out=$(echo '{"source":"startup"}' | CLAUDE_PROJECT_DIR="$t/elsewhere" CLAUDE_PLUGIN_ROOT="$d" sh "$d/scripts/skaldsaga" hook session-start)
          test -z "$out"
          echo '{"source":"startup"}' | CLAUDE_PROJECT_DIR="$t/novel" CLAUDE_PLUGIN_ROOT="$d" sh "$d/scripts/skaldsaga" hook session-start \
            | grep -q '"additionalContext"'
          test ! -e "$t/novel/.harness/meter.json"

          # First-run setup: creates the folders and wires the meter, then changes nothing
          mkdir "$t/fresh"
          sh "$d/scripts/skaldsaga" init --project "$t/fresh" \
            --meter-command "sh \"$d/scripts/skaldsaga\" meter statusline" \
            --user-settings "$t/none.json" | tee "$t/init.json"
          grep -q '"outcome": "created"' "$t/init.json"
          grep -q '"outcome": "wired"' "$t/init.json"
          for f in spec/README.md spec/sequence.md manuscript/README.md reviews/README.md style-guide/README.md .harness/settings.json; do
            test -f "$t/fresh/$f"
          done
          sh "$d/scripts/skaldsaga" init --project "$t/fresh" | grep -q '"outcome": "already_set_up"'
          # A folder holding the writer's own files is left alone
          mkdir "$t/drafts" && echo "Chapter one" > "$t/drafts/draft.txt"
          sh "$d/scripts/skaldsaga" init --project "$t/drafts" | grep -q '"outcome": "existing_files"'
          test ! -e "$t/drafts/.harness"

          # A missing binary must stay silent in the hook and the status line
          rm "$d/scripts/bin/linux-x64/skaldsaga"
          test -z "$(echo '{}' | sh "$d/scripts/skaldsaga" hook session-start)"
          test "$(echo '{}' | sh "$d/scripts/skaldsaga" meter statusline)" = ""

  # A short fuzz pass over the loaders (docs/security/appsec-tooling-research.md,
  # step 5). Fuzzing needs nightly Rust, so it has its own job; the nightly is
  # pinned by date and the tool by version (SR-42). A crash fails the job and
  # leaves the input in the job's annotations.
  fuzz:
    name: Fuzz smoke (Linux x64)
    runs-on: ubuntu-latest
    env:
      FUZZ_TOOLCHAIN: nightly-2026-10-24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner already has rustup, so no action is needed for this. The tool
      # is built with the pinned stable (its locked dependencies don't compile on
      # nightly) and then runs the targets on the pinned nightly.
      - name: Install the pinned toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo +1.97.0 install cargo-fuzz --locked --version 0.13.1

      - name: Fuzz the loaders
        run: sh ci/presubmit.sh fuzz
