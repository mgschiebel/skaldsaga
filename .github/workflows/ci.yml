name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by commit; the toolchain version is pinned here and in release.yml (SR-42).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check the shell scripts
        # Findings are turned into annotations so they show on the pull request.
        run: |
          set -o pipefail
          shellcheck -f gcc plugin/scripts/skaldsaga ci/assemble-dist.sh ci/check-session-links.sh \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'

      - name: Assemble the plugin
        run: sh ci/assemble-dist.sh dist target/release/skaldsaga

      - name: Validate the plugin
        run: |
          npm install --global --silent @anthropic-ai/claude-code@2.1.310
          claude plugin validate --strict dist
          claude plugin validate --strict dist/.claude-plugin/plugin.json

      - name: Smoke test the assembled plugin
        run: |
          set -eu
          d=$PWD/dist
          t=$(mktemp -d)
          mkdir -p "$t/novel/.harness" "$t/elsewhere"
          chmod -x "$d/scripts/skaldsaga" "$d/scripts/bin/linux-x64/skaldsaga"   # simulate an install that drops the bits
          sh "$d/scripts/skaldsaga" --version

          # Status line
          out=$(printf '{"session_id":"ci","workspace":{"project_dir":"%s"},"context_window":{"used_percentage":72}}' "$t/novel" \
            | sh "$d/scripts/skaldsaga" meter statusline)
          echo "$out"
          test "$out" = "Skaldsaga · session 72% full · time to wrap up"
          sh "$d/scripts/skaldsaga" meter check --project "$t/novel" | grep -q '"state": "wrap_up"'

          # Session-start hook: silent elsewhere, adds context in a project
          out=$(echo '{"source":"startup"}' | CLAUDE_PROJECT_DIR="$t/elsewhere" CLAUDE_PLUGIN_ROOT="$d" sh "$d/scripts/skaldsaga" hook session-start)
          test -z "$out"
          echo '{"source":"startup"}' | CLAUDE_PROJECT_DIR="$t/novel" CLAUDE_PLUGIN_ROOT="$d" sh "$d/scripts/skaldsaga" hook session-start \
            | grep -q '"additionalContext"'
          test ! -e "$t/novel/.harness/meter.json"

          # First-run setup: creates the folders and wires the meter, then changes nothing
          mkdir "$t/fresh"
          sh "$d/scripts/skaldsaga" init --project "$t/fresh" \
            --meter-command "sh \"$d/scripts/skaldsaga\" meter statusline" \
            --user-settings "$t/none.json" | tee "$t/init.json"
          grep -q '"outcome": "created"' "$t/init.json"
          grep -q '"outcome": "wired"' "$t/init.json"
          for f in spec/README.md spec/sequence.md manuscript/README.md reviews/README.md style-guide/README.md .harness/settings.json; do
            test -f "$t/fresh/$f"
          done
          sh "$d/scripts/skaldsaga" init --project "$t/fresh" | grep -q '"outcome": "already_set_up"'
          # A folder holding the writer's own files is left alone
          mkdir "$t/drafts" && echo "Chapter one" > "$t/drafts/draft.txt"
          sh "$d/scripts/skaldsaga" init --project "$t/drafts" | grep -q '"outcome": "existing_files"'
          test ! -e "$t/drafts/.harness"

          # A missing binary must stay silent in the hook and the status line
          rm "$d/scripts/bin/linux-x64/skaldsaga"
          test -z "$(echo '{}' | sh "$d/scripts/skaldsaga" hook session-start)"
          test "$(echo '{}' | sh "$d/scripts/skaldsaga" meter statusline)" = ""
