name: Audit

# Checks the locked dependencies against the RustSec advisory database
# (SR-43). Runs when dependencies change, and weekly, because new advisories
# appear for code that hasn't changed. Warnings (unmaintained or yanked
# crates) fail it too.

on:
  push:
    branches: ["**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0

      # Built from the locked, checksummed crates.io release of this exact version.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit
        run: cargo audit --deny warnings
